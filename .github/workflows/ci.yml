# Verificação mínima da aula: instalação pelo lockfile, build e os testes existentes.
# Obs.: PRs abertos pela automação com GITHUB_TOKEN não disparam este workflow; para eles,
# o job verificar-pr do ai-agents.yml faz a mesma conferência no commit atual do PR.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
